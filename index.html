<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>플래피 버드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Silkscreen&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">
  <header class="top">
    <h1><span class="badge-icon">🐤</span>플래피 버드</h1>
    <div id="status" class="status ready"><i></i><span id="statusText">준비</span></div>
  </header>

  <section class="hud">
    <div class="stat"><label>점수</label><strong id="score">0</strong></div>
    <div class="stat"><label>최고</label><strong id="best">0</strong></div>
    <button id="pauseBtn" class="pause-btn" aria-label="일시정지">Ⅱ</button>
  </section>

  <div id="stage">
    <canvas id="board" width="180" height="320"></canvas>

    <div id="overlay" class="overlay">
      <div id="startPanel" class="panel">
        <h2>플래피 버드</h2>
        <p>화면을 탭하거나 스페이스를 눌러 날갯짓!<br>
          파이프 사이를 지날 때마다 1점.<br>
          파이프·땅·천장에 닿으면 끝이에요.</p>
        <p class="best-line">최고 기록 <b id="startBest">0</b></p>
        <button id="startBtn" class="btn">시작하기</button>
      </div>

      <div id="pausePanel" class="panel hidden">
        <h2>일시정지</h2>
        <p>잠깐 쉬어 가요.</p>
        <button id="resumeBtn" class="btn">계속하기</button>
      </div>

      <div id="overPanel" class="panel hidden">
        <h2 class="over-title">게임 오버</h2>
        <p id="overReason">파이프에 부딪혔어요</p>
        <div class="result-row">
          <div id="medal" class="medal none" title="메달"></div>
          <dl class="result">
            <dt>점수</dt><dd id="overScore">0</dd>
            <dt>최고</dt><dd id="overBest">0</dd>
          </dl>
        </div>
        <span id="overRecord" class="record hidden">신기록!</span>
        <p class="medal-hint" id="medalHint">10점 동메달 · 20점 은메달 · 40점 금메달</p>
        <button id="retryBtn" class="btn">다시하기</button>
      </div>
    </div>
  </div>

  <p class="keys"><kbd>Space</kbd> <kbd>↑</kbd> 클릭·탭 날갯짓 · <kbd>P</kbd> <kbd>Esc</kbd> 일시정지 · <kbd>Enter</kbd> 시작/다시하기</p>
</main>
<script src="script.js"></script>
</body>
</html>
